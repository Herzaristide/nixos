# Alertes vulnix vérifiées et ignorées (.github/vulnix/scan.sh, workflow .github/workflows/vulnix.yml).
#
# N'y ajouter une entrée qu'après avoir vérifié que la faille est corrigée dans
# nixpkgs (patch sans changement de version) ou ne s'applique pas (paquet
# homonyme, fonctionnalité non compilée). Toujours avec un commentaire et une
# date d'expiration : l'alerte revient d'elle-même après `until`.
#
# Exemple :
#
# ["zlib-1.3.2"]
# cve = ["CVE-2023-45853"]
# until = "2027-01-01"
# comment = "minizip seulement, non compilé dans zlib de nixpkgs"

# --- Vérifié le 2026-11-03 sur les descriptions NVD et les paquets nixpkgs. ---
# Seules les CVE citées sont ignorées : une nouvelle CVE sur ces paquets alerte.

# --- FAILLE RÉELLE, exception temporaire ---

["brotli-1.2.0"]
cve = ["CVE-2026-111497"]
until = "2026-11-17"
comment = "RÉELLE, non corrigée dans nixos-unstable : le fix (1.2.1) est dans staging-next de nixpkgs, et le forcer ici recompilerait une grande partie du système. Expire volontairement vite : mettre à jour dès que 1.2.1 arrive (l'entrée devient alors sans objet)."

["edk2-202608"]
cve = ["CVE-2026-111497"]
until = "2026-12-01"
comment = "Brotli embarqué dans le firmware OVMF de la VM Cowork (claude-desktop) : il ne décode que les volumes du firmware au démarrage, pas de contenu réseau. À revérifier à la prochaine version d'edk2."

