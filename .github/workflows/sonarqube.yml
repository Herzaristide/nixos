name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonarqube:
    name: Analyse SonarQube
    runs-on: ubuntu-latest
    env:
      # SonarQube Cloud. Seul le jeton est secret ; il se configure dans
      # Settings → Secrets and variables → Actions → SONAR_TOKEN.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : détection du « new code » et blame.
          fetch-depth: 0

      - name: Scan SonarQube
        # Sauté proprement si le jeton n'est pas configuré (ex : PR de fork).
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
