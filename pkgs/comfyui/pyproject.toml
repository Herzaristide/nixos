# Dépendances Python du serveur ComfyUI (modules/comfyui.nix), figées par
# uv.lock à côté. Reprend ce que l'extension Krita AI Diffusion installe
# elle-même pour son serveur local (ai_diffusion/backend/requirements/base.in
# de la release épinglée dans modules/comfyui.nix), plus le requirements.txt de
# ComfyUI à la révision qu'elle exige. torch/torchvision/torchaudio viennent de
# l'index ROCm de PyTorch, à la version que prend l'extension.
#
# Mettre à jour (avec une nouvelle release de l'extension) : reprendre ses
# versions de torch et la liste de base.in, puis `uv lock --upgrade` dans ce
# dossier et rebuild de gary — le service resynchronise le venv au démarrage
# suivant.
[project]
name = "comfyui-server"
version = "0"
requires-python = "==3.12.*"
dependencies = [
  # ComfyUI (requirements.txt à la révision épinglée)
  "comfyui-frontend-package==1.53.10",
  "comfyui-workflow-templates==0.11.76",
  "comfyui-embedded-docs==0.5.13",
  "comfy-kitchen==0.2.37",
  "comfy-aimdo==0.5.5",
  "torch==2.13.0",
  "torchvision==0.28.0",
  "torchaudio==2.11.0",
  # Dépendance de torch ROCm, listée pour que uv la prenne sur le même index
  # (les `sources` ne s'appliquent qu'aux dépendances directes).
  "triton-rocm",
  "torchsde",
  "numpy>=1.25.0",
  "einops",
  "transformers>=4.54",
  "tokenizers>=0.13.3",
  "sentencepiece==0.2.0",
  "safetensors>=0.4.2",
  "aiohttp>=3.11.8",
  "yarl>=1.18.0",
  "pyyaml",
  "pillow",
  "scipy",
  "tqdm",
  "psutil",
  "alembic",
  "sqlalchemy>=2.0.0",
  "filelock",
  "av>=17.0.0",
  "requests",
  "simpleeval>=1.0.0",
  "blake3",
  "kornia>=0.7.1",
  "spandrel",
  "soundfile",
  "pydantic~=2.0",
  "pydantic-settings~=2.0",
  "stringzilla",
  # comfyui_controlnet_aux (préprocesseurs : profondeur, contours…)
  "importlib-metadata",
  "huggingface-hub",
  "opencv-python",
  "protobuf",
  "scikit-image",
  "python-dateutil",
  "mediapipe>=0.8.0",
  # Épinglé comme dans l'extension : plus récent, il demande pycairo.
  "svglib==1.5.1",
  "fvcore",
  "yapf",
  "omegaconf",
  "ftfy",
  "addict",
  "yacs",
  "albumentations",
  "scikit-learn",
  "matplotlib",
  # ComfyUI-GGUF (modèles quantifiés)
  "gguf",
  # comfyui-tooling-nodes (nœud de traduction des prompts)
  "argostranslate",
  # argostranslate installe des choses à la demande avec pip sans en dépendre.
  "pip",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
torchvision = { index = "pytorch-rocm" }
torchaudio = { index = "pytorch-rocm" }
triton-rocm = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true
