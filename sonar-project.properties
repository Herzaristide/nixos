# Configuration SonarQube Cloud. organization + projectKey doivent correspondre
# à ce qui est affiché dans SonarCloud (Administration → Update Key). Chaque
# projet a sa propre clé, distincte de celle des autres dépôts.
sonar.organization=herzaristide
sonar.projectKey=Herzaristide_nixos
sonar.projectName=nixos

# Analyse le dépôt en excluant le Nix (non supporté par Sonar de toute façon on
# le garde, mais surtout) le généré / vendored / binaire :
#   - docs/ : site statique (node_modules + build)
#   - src/  : fonds d'écran et binaires (~70 Mio)
#   - secrets/ : secrets chiffrés (rien à auditer, ne pas indexer)
#   - lockfiles
sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.exclusions=docs/node_modules/**,docs/dist/**,src/**,secrets/**,flake.lock,**/package-lock.json
